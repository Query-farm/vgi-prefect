# vgi-lint settings for this worker: https://github.com/Query-farm/vgi-lint-check
# `make lint-explain`, `vgi-lint lint` in this directory, and CI's metadata job all
# read this file. Look up a rule with `vgi-lint explain VGI123`; print the metadata tag
# contract with `vgi-lint spec`.

# The worker to attach, relative to this directory. Build it first with `make build`.
location = ".venv/bin/vgi-prefect-worker"

# Fail on warnings while you build. Raise this to "info" before you publish the worker.
fail_on = "info"

# Waive a finding only with a kind and a reason, so the waiver can be audited:
#   domain-exemption  permanent and legitimate for this worker
#   deferred          a real defect you will fix; add expires = "YYYY-MM-DD"
#   timing            slow or flaky because of the environment, not the metadata
#   tooling-bug       the linter is wrong; report it upstream
ignore = [
  # { code = "VGI146", kind = "domain-exemption", reason = "every entry point needs a key" },
]

# VGI808 guesses a foreign key from a `<base>_id` column name. Every reference Prefect's own
# database enforces is declared (deployments/flow_runs->flows, flow_runs->deployments,
# task_runs->flow_runs, deployment_schedules->deployments, work_queues/workers->work_pools,
# block_documents->block_types, unified.task_runs->unified.runs). The rest:
[per_object."prefect.unified.runs"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "run_id is this table's own primary key" }]
[per_object."prefect.unified.task_runs"]
ignore = [{ code = "VGI808", kind = "tooling-bug", reason = "task_run_id is this table's own primary key; its run_id FK to runs is declared" }]
# Logs and artifacts carry run ids without a database foreign key in Prefect: log lines are
# shipped asynchronously (they can arrive before the run row, and outlive a deleted run), so a
# foreign key could not be attested ENFORCED.
[per_object."prefect.main.flow_run_logs"]
ignore = [{ code = "VGI808", kind = "domain-exemption", reason = "Prefect logs have no FK to flow_runs; lines can outlive a deleted run" }]
[per_object."prefect.main.task_run_logs"]
ignore = [{ code = "VGI808", kind = "domain-exemption", reason = "Prefect logs have no FK to runs; lines can outlive a deleted run" }]
[per_object."prefect.main.artifacts"]
ignore = [{ code = "VGI808", kind = "domain-exemption", reason = "Prefect artifacts reference runs without a database FK and can outlive them" }]

# Adopting the gate on a worker that already has findings? Record them once with
#   vgi-lint lint --baseline vgi-lint-baseline --update-baseline
# and uncomment the next line. Only new findings fail after that.
# baseline = "vgi-lint-baseline"
